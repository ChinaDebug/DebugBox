[versions]
# ---------- 构建工具 ----------
androidGradlePlugin = "9.2.0"
kotlin = "2.3.10"
ksp = "2.3.9"
chaquoPython = "17.0.0"
desugarJdkLibs = "2.1.5"

# ---------- Kotlin & 协程 ----------
coroutines = "1.10.2"

# ---------- AndroidX 基础 ----------
appcompat = "1.7.1"
coreKtx = "1.16.0"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
annotation = "1.10.0"
fragment = "1.8.9"
navigation = "2.9.3"

# ---------- AndroidX 架构 ----------
lifecycle = "2.11.0"
room = "2.8.4"
datastore = "1.1.7"

# ---------- 依赖注入 ----------
hilt = "2.60.1"
hiltNavigation = "1.2.0"

# ---------- 网络 ----------
okhttp = "4.12.0"
okio = "3.17.0"

# ---------- 序列化与解析 ----------
gson = "2.14.0"
xstream = "1.4.21"
jsoup = "1.22.2"
simpleXml = "2.7.1"

# ---------- UI 组件与图片 ----------
loadsir = "1.3.8"
autosize = "1.2.1"
flowLayout = "v1.5"
coil = "3.4.0"
zxing = "3.5.4"
danmakuFlameMaster = "0.9.25"

# ---------- 权限与 TV ----------
xxpermissions = "28.3"
tvRecyclerview = "3.0.0"

# ---------- 媒体播放 ----------
gsyVideoPlayer = "v13.2.1"
media3 = "1.11.0"

# ---------- 其他工具库 ----------
brotli = "0.1.2"
conscrypt = "2.6.1"
checkerQual = "3.13.0"
sardineAndroid = "0.8"
nanohttpd = "nanohttpd-project-2.3.1"
nanohttpdWebsocket = "nanohttpd-project-2.3.1"

[libraries]
# ---------- Kotlin & 协程 ----------
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# ---------- AndroidX 基础 ----------
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }

# ---------- AndroidX 架构 ----------
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# ---------- 依赖注入 ----------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-fragment", version.ref = "hiltNavigation" }

# ---------- 网络 ----------
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

# ---------- 序列化与解析 ----------
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
xstream = { module = "com.thoughtworks.xstream:xstream", version.ref = "xstream" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
simple-xml = { module = "org.simpleframework:simple-xml", version.ref = "simpleXml" }

# ---------- UI 组件与图片 ----------
loadsir = { module = "com.kingja.loadsir:loadsir", version.ref = "loadsir" }
autosize = { group = "me.jessyan", name = "autosize", version.ref = "autosize" }
flow-layout = { module = "com.github.alidili:FlowLayout", version.ref = "flowLayout" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
danmaku-flame-master = { module = "com.github.ctiao:DanmakuFlameMaster", version.ref = "danmakuFlameMaster" }

# ---------- 权限与 TV ----------
xxpermissions = { module = "com.github.getActivity:XXPermissions", version.ref = "xxpermissions" }
tv-recyclerview = { module = "com.owen:tv-recyclerview", version.ref = "tvRecyclerview" }

# ---------- 媒体播放 ----------
gsyvideo-java = { module = "com.github.CarGuo.GSYVideoPlayer:gsyvideoplayer-java", version.ref = "gsyVideoPlayer" }
gsyvideo-exo2 = { module = "com.github.CarGuo.GSYVideoPlayer:gsyvideoplayer-exo2", version.ref = "gsyVideoPlayer" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }

# ---------- 其他工具库 ----------
brotli = { module = "org.brotli:dec", version.ref = "brotli" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checkerQual" }
sardine-android = { module = "com.github.thegrizzlylabs:sardine-android", version.ref = "sardineAndroid" }
nanohttpd = { module = "com.github.NanoHttpd.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { module = "com.github.NanoHttpd.nanohttpd:nanohttpd-websocket", version.ref = "nanohttpdWebsocket" }

# ---------- 构建工具 ----------
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
chaquo-python = { id = "com.chaquo.python", version.ref = "chaquoPython" }

[bundles]
lifecycle = [
    "lifecycle-viewmodel",
    "lifecycle-livedata",
    "lifecycle-runtime",
]
coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
]
