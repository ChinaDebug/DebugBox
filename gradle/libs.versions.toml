[versions]
# 构建工具版本
kotlin = "2.3.10"
ksp = "2.3.9"
androidGradlePlugin = "9.2.0"
chaquoPython = "17.0.0"
desugarJdkLibs = "2.1.5"

# AndroidX 核心库
appcompat = "1.7.1"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
material = "1.14.0"
annotation = "1.10.0"

# AndroidX 架构组件
lifecycle = "2.11.0"
room = "2.8.4"

# 媒体播放
media3 = "1.10.1"
nextlibMedia3Ext = "1.10.1-0.13.0"
dkPlayer = "3.3.7"

# 网络
okhttp = "4.12.0"
okio = "3.17.0"
okgo = "3.0.4"

# 序列化与数据
 gson = "2.14.0"
xstream = "1.4.21"
hawk = "2.0.1"
jsoup = "1.22.2"
commonsIo = "2.22.0"
commonsLang3 = "3.17.0"

# 图片加载
glide = "4.16.0"

# UI 组件与工具
baseRecyclerViewAdapterHelper = "2.9.49-androidx"
loadsir = "1.3.8"
autosize = "1.2.1"
flowLayout = "v1.5"
viewpump = "2.1.1"
calligraphy3 = "3.1.1"
danmakuFlameMaster = "0.9.25"
utilcodex = "1.31.1"

# 权限与 TV
xxpermissions = "28.3"
tvRecyclerview = "3.0.0"

# 其他工具库
zxing = "3.5.4"
eventbus = "3.3.1"
juniversalchardet = "1.0.3"
brotli = "0.1.2"
conscrypt = "2.6.1"
sardineAndroid = "0.8"
nanohttpd = "nanohttpd-project-2.3.1"
nanohttpdWebsocket = "nanohttpd-websocket-2.3.1"
simpleXml = "2.7.1"
jspecify = "1.0.0"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# AndroidX 核心
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }

# AndroidX 生命周期
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }

# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# 媒体播放
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-rtsp = { module = "androidx.media3:media3-exoplayer-rtsp", version.ref = "media3" }
media3-datasource-rtmp = { module = "androidx.media3:media3-datasource-rtmp", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
nextlib-media3ext = { module = "io.github.anilbeesetti:nextlib-media3ext", version.ref = "nextlibMedia3Ext" }
dkplayer-ui = { module = "xyz.doikki.android.dkplayer:dkplayer-ui", version.ref = "dkPlayer" }
dkplayer-videocache = { module = "xyz.doikki.android.dkplayer:videocache", version.ref = "dkPlayer" }

# 网络
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okgo = { module = "com.lzy.net:okgo", version.ref = "okgo" }

# 序列化与数据
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
xstream = { module = "com.thoughtworks.xstream:xstream", version.ref = "xstream" }
hawk = { module = "com.orhanobut:hawk", version.ref = "hawk" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }

# 图片加载
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

# UI 组件与工具
base-recyclerview-adapter-helper = { module = "com.github.CymChad:BaseRecyclerViewAdapterHelper", version.ref = "baseRecyclerViewAdapterHelper" }
loadsir = { module = "com.kingja.loadsir:loadsir", version.ref = "loadsir" }
autosize = { module = "me.jessyan:autosize", version.ref = "autosize" }
flow-layout = { module = "com.github.alidili:FlowLayout", version.ref = "flowLayout" }
viewpump = { module = "io.github.inflationx:viewpump", version.ref = "viewpump" }
calligraphy3 = { module = "io.github.inflationx:calligraphy3", version.ref = "calligraphy3" }
danmaku-flame-master = { module = "com.github.ctiao:DanmakuFlameMaster", version.ref = "danmakuFlameMaster" }
utilcodex = { module = "com.blankj:utilcodex", version.ref = "utilcodex" }

# 权限与 TV
xxpermissions = { module = "com.github.getActivity:XXPermissions", version.ref = "xxpermissions" }
tv-recyclerview = { module = "com.owen:tv-recyclerview", version.ref = "tvRecyclerview" }

# 其他工具库
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
eventbus = { module = "org.greenrobot:eventbus", version.ref = "eventbus" }
juniversalchardet = { module = "com.googlecode.juniversalchardet:juniversalchardet", version.ref = "juniversalchardet" }
brotli = { module = "org.brotli:dec", version.ref = "brotli" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
sardine-android = { module = "com.github.thegrizzlylabs:sardine-android", version.ref = "sardineAndroid" }
nanohttpd = { module = "com.github.NanoHttpd.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { module = "com.github.NanoHttpd.nanohttpd:nanohttpd", version.ref = "nanohttpdWebsocket" }
simple-xml = { module = "org.simpleframework:simple-xml", version.ref = "simpleXml" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# 构建工具
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
chaquo-python = { id = "com.chaquo.python", version.ref = "chaquoPython" }

[bundles]
media3 = [
    "media3-exoplayer",
    "media3-ui",
    "media3-exoplayer-dash",
    "media3-exoplayer-hls",
    "media3-exoplayer-rtsp",
    "media3-datasource-rtmp",
    "media3-common"
]
lifecycle = [
    "lifecycle-viewmodel",
    "lifecycle-livedata",
    "lifecycle-runtime"
]
