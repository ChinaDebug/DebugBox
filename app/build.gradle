plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

def static buildTime() {
    return new Date().format("yyyyMMdd_HHmm", TimeZone.getTimeZone("GMT+08:00"))
}

def getSigningConfig() {
    // 优先级：环境变量 > 本地 keystore.properties > 临时签名
    def config = [:]

    // 1. 尝试从环境变量读取（GitHub Actions 使用）
    config.storeFile = System.getenv("SIGNING_KEYSTORE_FILE")
    config.storePassword = System.getenv("SIGNING_STORE_PASSWORD")
    config.keyAlias = System.getenv("SIGNING_KEY_ALIAS")
    config.keyPassword = System.getenv("SIGNING_KEY_PASSWORD")

    // 2. 如果环境变量不存在，尝试从本地文件读取
    if (config.storeFile == null || config.storeFile.isEmpty()) {
        // 先检查 app 目录下的 keystore.properties
        def keystorePropsFile = project.file("keystore.properties")
        if (!keystorePropsFile.exists()) {
            // 再检查根目录
            keystorePropsFile = rootProject.file("keystore.properties")
        }
        if (keystorePropsFile.exists()) {
            def keystoreProps = new Properties()
            keystoreProps.load(new FileInputStream(keystorePropsFile))
            config.storeFile = keystoreProps['storeFile']
            config.storePassword = keystoreProps['storePassword']
            config.keyAlias = keystoreProps['keyAlias']
            config.keyPassword = keystoreProps['keyPassword']
        }
    }

    return config
}

android {
    namespace = 'com.github.tvbox.osc'
    compileSdk = 36

    signingConfigs {
        release {
            def config = getSigningConfig()
            if (config.storeFile != null && !config.storeFile.isEmpty()) {
                storeFile = file(config.storeFile)
                storePassword = config.storePassword
                keyAlias = config.keyAlias
                keyPassword = config.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId = 'com.github.tvbox.osc.debug'
        targetSdkVersion = 36
        versionCode = 1
        versionName = "1.0.".concat(buildTime())
        minSdkVersion = 24
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        jniLibs {
            useLegacyPackaging = true
            excludes += ['lib/armeabi/**', 'lib/x86/**', 'lib/x86_64/**', 'lib/mips/**', 'lib/mips64/**']
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            zipAlignEnabled = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions = ["abi", "brand"]
    productFlavors {
        arm64 {
            dimension = "abi"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        arm32 {
            dimension = "abi"
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }

        generic  {
            dimension = "brand"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
        disable 'UnsafeOptInUsageError'
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abi = variant.flavorName?.toLowerCase()?.replace("generic", "") ?: ""
            def fileName = abi.isEmpty()
                    ? "TVBox_CloudDebug-${buildTime()}.apk"
                    : "TVBox_CloudDebug-${buildTime()}-${abi}.apk"
            output.outputFileName.set(fileName)
        }
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

dependencies {
    api fileTree(dir: "libs", include: ['*.jar', '*.aar'])

    // Kotlin 与项目模块
    implementation libs.kotlin.stdlib
    implementation project(path: ':quickjs')
    implementation project(':pyramid')

    // AndroidX 核心与生命周期
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.material
    implementation libs.androidx.annotation
    implementation libs.bundles.lifecycle

    // Room
    ksp libs.room.compiler
    implementation libs.room.runtime

    // 媒体播放
    implementation libs.bundles.media3
    implementation libs.nextlib.media3ext
    implementation libs.dkplayer.ui
    implementation libs.dkplayer.videocache

    // 网络
    implementation libs.okhttp
    implementation libs.okio
    implementation libs.okgo
    implementation(libs.sardine.android) {
        exclude group: 'com.squareup.okhttp3'
    }
    implementation libs.nanohttpd
    implementation libs.nanohttpd.websocket

    // 序列化与数据
    implementation libs.gson
    implementation(libs.xstream) {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation(libs.simple.xml) {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
    }
    implementation libs.hawk
    implementation libs.jsoup
    implementation libs.commons.io
    implementation libs.commons.lang3
    implementation libs.jspecify

    // 图片加载
    implementation libs.glide
    ksp libs.glide.compiler

    // UI 组件与工具
    implementation libs.base.recyclerview.adapter.helper
    implementation libs.loadsir
    implementation(libs.autosize) {
        exclude group: 'com.android.support'
    }
    implementation libs.flow.layout
    implementation libs.viewpump
    implementation libs.calligraphy3
    implementation libs.danmaku.flame.master
    implementation libs.utilcodex
    implementation libs.zxing
    implementation libs.eventbus
    implementation libs.juniversalchardet
    implementation libs.brotli
    implementation libs.conscrypt

    // 权限与 TV
    implementation libs.xxpermissions
    implementation libs.tv.recyclerview

    // 脱糖
    coreLibraryDesugaring libs.desugar.jdk.libs

    // 全局排除冲突依赖
    configurations.configureEach {
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
    }
}
